# mysite_nginx.conf

# the upstream component nginx needs to connect to
upstream django {
    # server unix:///path/to/your/mysite/mysite.sock; # for a file socket
    server 127.0.0.1:8001; # for a web port socket (we'll use this first)
}

# configuration of the server
server {
    # the port your site will be served on
    # the domain name it will serve for
    server_name pstf.cottagelabs.com; # substitute your machine's IP address or FQDN
    charset     utf-8;

    # max upload size
    client_max_body_size 75M;   # adjust to taste

    # Django media
    #location /media  {
    #    alias /path/to/your/mysite/media;  # your Django project's media files - amend as required
    #}

    location /static {
        alias /home/cloo/pstf/staticfiles; # your Django project's static files - amend as required
    }

    # Uncomment the following line to enable maintenance mode
    #return 503;

     error_page 503 @maintenance;
     location @maintenance {
        root /home/cloo/pstf/static/assets/html;
        rewrite ^(.*)$ /maintenance.html break;
    }


    location ^~ /admin/ { # block anything beginning with /admin/
        allow 127.0.0.1;
        deny all;

        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # Finally, send all non-media requests to the Django server.
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pstf.cottagelabs.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pstf.cottagelabs.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = pstf.cottagelabs.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen      80;
    server_name pstf.cottagelabs.com;
    return 404; # managed by Certbot


}
