[program:data_dump]
command=bash -c 'source /home/cloo/pstf/venv/bin/activate && python3 /home/cloo/pstf/manage.py scheduled_data_dump --settings pstf.settings.prod'
autostart=true
autorestart=true
stderr_logfile=/var/log/pstf_data_dump.err.log
stdout_logfile=/var/log/pstf_data_dump.out.log

[program:build_index]
command=bash -c 'source /home/cloo/pstf/venv/bin/activate && python3 /home/cloo/pstf/manage.py build_index --settings pstf.settings.prod'
autostart=true
autorestart=true
stderr_logfile=/var/log/pstf_build_index.err.log
stdout_logfile=/var/log/pstf_build_index.out.log